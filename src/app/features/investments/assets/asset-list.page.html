<app-crud-page title="Ativos" (create)="openForm()">
  <app-investments-nav />

  <app-filter-bar [fields]="filters" [initial]="{}" (changed)="list.setFilter($event)" />

  <app-data-table [columns]="columns" [list]="list" [actions]="actions" (action)="onAction($event)">
    <ng-template appCell="fixedIncome" let-row>
      @if (row.fixedIncome; as fi) {
        {{ fi.indexer | enumLabel: 'indexer' }} {{ fi.rate }}%
      }
    </ng-template>
  </app-data-table>
</app-crud-page>
