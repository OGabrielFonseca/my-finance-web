<form [formGroup]="form" (ngSubmit)="submit.submit()" class="flex flex-col gap-4">
  <div class="grid grid-cols-2 gap-4">
    <app-field label="Ticker" fieldId="asset-ticker" [control]="form.controls.ticker">
      <input pInputText id="asset-ticker" formControlName="ticker" />
    </app-field>

    <app-field label="Classe" fieldId="asset-class" [control]="form.controls.assetClass">
      <p-select
        inputId="asset-class"
        formControlName="assetClass"
        [options]="classOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </app-field>
  </div>

  <app-field label="Nome" fieldId="asset-name" [control]="form.controls.name">
    <input pInputText id="asset-name" formControlName="name" />
  </app-field>

  @if (fixedIncome()) {
    <fieldset class="m-0 flex flex-col gap-4 rounded-border border border-surface p-4">
      <legend class="px-1 text-sm text-muted-color">{{ 'Detalhes de renda fixa' }}</legend>

      <app-field label="Emissor" fieldId="asset-issuer" [control]="form.controls.issuer">
        <input pInputText id="asset-issuer" formControlName="issuer" />
      </app-field>

      <div class="grid grid-cols-2 gap-4">
        <app-field label="Indexador" fieldId="asset-indexer" [control]="form.controls.indexer">
          <p-select
            inputId="asset-indexer"
            formControlName="indexer"
            [options]="indexerOptions"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
          />
        </app-field>

        <app-field label="Taxa (%)" fieldId="asset-rate" [control]="form.controls.rate">
          <p-inputnumber
            inputId="asset-rate"
            formControlName="rate"
            [minFractionDigits]="0"
            [maxFractionDigits]="8"
            suffix=" %"
          />
        </app-field>
      </div>

      <div class="grid grid-cols-2 items-end gap-4">
        <app-field label="Vencimento" fieldId="asset-maturity" [control]="form.controls.maturityDate">
          <p-datepicker
            inputId="asset-maturity"
            formControlName="maturityDate"
            dateFormat="dd/mm/yy"
            [showButtonBar]="true"
            appendTo="body"
          />
        </app-field>

        <label for="asset-tax" class="flex items-center gap-2 pb-2 text-sm">
          <p-checkbox inputId="asset-tax" formControlName="taxExempt" [binary]="true" />
          {{ 'Isento de imposto de renda' }}
        </label>
      </div>
    </fieldset>
  }

  <app-form-footer [submit]="submit" (cancelled)="ref.close(false)" />
</form>
