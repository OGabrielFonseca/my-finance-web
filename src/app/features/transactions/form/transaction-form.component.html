<form [formGroup]="form" (ngSubmit)="submit.submit()" class="flex flex-col gap-4">
  @if (noCategories()) {
    <p-message severity="warn">
      <span class="flex flex-wrap items-center gap-2">
        {{ 'transactions.noCategories' | transloco: { type: ('enums.categoryType.' + data.type | transloco) } }}
        <a routerLink="/categories" class="font-semibold" (click)="ref.close(false)">
          {{ 'transactions.goToCategories' | transloco }}
        </a>
      </span>
    </p-message>
  }

  <app-field label="transactions.fields.description" fieldId="tx-description" [control]="form.controls.description">
    <input pInputText id="tx-description" formControlName="description" />
  </app-field>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-field label="transactions.fields.amount" fieldId="tx-amount" [control]="form.controls.amount">
      <p-inputnumber
        inputId="tx-amount"
        formControlName="amount"
        mode="currency"
        currency="BRL"
        locale="pt-BR"
        [min]="0.01"
        [fluid]="true"
      />
    </app-field>

    <app-field label="transactions.fields.date" fieldId="tx-date" [control]="form.controls.date">
      <p-datepicker
        inputId="tx-date"
        formControlName="date"
        dateFormat="dd/mm/yy"
        [showButtonBar]="true"
        [fluid]="true"
        appendTo="body"
      />
    </app-field>
  </div>

  <app-field label="transactions.fields.category" fieldId="tx-category" [control]="form.controls.categoryId">
    <p-select
      inputId="tx-category"
      formControlName="categoryId"
      [options]="categoryOptions()"
      optionLabel="label"
      optionValue="value"
      [filter]="true"
      filterBy="label"
      [placeholder]="'common.select' | transloco"
      appendTo="body"
    >
      <ng-template #item let-option>
        <span class="flex items-center gap-2" [style.padding-left.rem]="(option.depth ?? 0) * 1.25">
          <span class="inline-block size-3 rounded-full" [style.background]="option.color"></span>
          {{ option.label }}
        </span>
      </ng-template>
    </p-select>
  </app-field>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-field label="transactions.fields.account" fieldId="tx-account" [control]="form.controls.accountId">
      <p-select
        inputId="tx-account"
        formControlName="accountId"
        [options]="accountOptions()"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'common.select' | transloco"
        appendTo="body"
      />
    </app-field>

    <app-field label="transactions.fields.status" fieldId="tx-status" [control]="form.controls.status">
      <p-select
        inputId="tx-status"
        formControlName="status"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
      <small class="text-muted-color">{{ 'transactions.statusHint' | transloco }}</small>
    </app-field>
  </div>

  <app-field label="transactions.fields.notes" fieldId="tx-notes" [control]="form.controls.notes">
    <textarea pTextarea id="tx-notes" formControlName="notes" rows="2" [autoResize]="true"></textarea>
  </app-field>

  <app-form-footer [submit]="submit" (cancelled)="ref.close(false)" />
</form>
