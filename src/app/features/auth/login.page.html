<main class="flex min-h-screen items-center justify-center p-4">
  <section class="w-full max-w-sm rounded-border border border-surface bg-surface-0 p-6 shadow-sm dark:bg-surface-900">
    <header class="mb-6 flex flex-col gap-1">
      <span class="flex items-center gap-2 text-xl font-semibold">
        <i class="pi pi-wallet"></i>
        {{ 'MyFinance' }}
      </span>
      <h1 class="m-0 text-2xl font-semibold">{{ 'Entrar' }}</h1>
      <p class="m-0 text-muted-color">{{ 'Suas finanças e investimentos em um só lugar.' }}</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit.submit()" class="flex flex-col gap-4">
      <app-field label="E-mail" fieldId="login-email" [control]="form.controls.email">
        <input pInputText id="login-email" type="email" autocomplete="username" formControlName="email" />
      </app-field>

      <app-field label="Senha" fieldId="login-password" [control]="form.controls.password">
        <p-password
          inputId="login-password"
          formControlName="password"
          autocomplete="current-password"
          [feedback]="false"
          [toggleMask]="true"
          [fluid]="true"
        />
      </app-field>

      @if (submit.error(); as message) {
        <p-message severity="error">{{ message }}</p-message>
      }

      <p-button type="submit" [label]="'Entrar'" [loading]="submit.submitting()" [fluid]="true" />

      <app-google-sign-in text="signin_with" (signedIn)="goToApp()" />

      <a routerLink="/register" class="text-center text-sm text-primary">{{ 'Não tem conta? Cadastre-se' }}</a>
    </form>
  </section>
</main>
