<main class="flex min-h-screen items-center justify-center p-4">
  <section class="w-full max-w-sm rounded-border border border-surface bg-surface-0 p-6 shadow-sm dark:bg-surface-900">
    <header class="mb-6 flex flex-col gap-1">
      <span class="flex items-center gap-2 text-xl font-semibold">
        <i class="pi pi-wallet"></i>
        {{ 'MyFinance' }}
      </span>
      <h1 class="m-0 text-2xl font-semibold">{{ 'Criar conta' }}</h1>
      <p class="m-0 text-muted-color">{{ 'Leva menos de um minuto.' }}</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit.submit()" class="flex flex-col gap-4">
      <app-field label="Nome" fieldId="register-name" [control]="form.controls.name">
        <input pInputText id="register-name" type="text" autocomplete="name" formControlName="name" />
      </app-field>

      <app-field label="E-mail" fieldId="register-email" [control]="form.controls.email">
        <input pInputText id="register-email" type="email" autocomplete="username" formControlName="email" />
      </app-field>

      <app-field label="Senha" fieldId="register-password" [control]="form.controls.password">
        <p-password
          inputId="register-password"
          formControlName="password"
          autocomplete="new-password"
          [feedback]="false"
          [toggleMask]="true"
          [fluid]="true"
        />
      </app-field>

      @if (submit.error(); as message) {
        <p-message severity="error">{{ message }}</p-message>
      }

      <p-button type="submit" [label]="'Cadastrar'" [loading]="submit.submitting()" [fluid]="true" />

      <app-google-sign-in text="signup_with" (signedIn)="goToApp()" />

      <a routerLink="/login" class="text-center text-sm text-primary">{{ 'Já tem conta? Entrar' }}</a>
    </form>
  </section>
</main>
