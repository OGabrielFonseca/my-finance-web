<section class="flex flex-col gap-4">
  <header class="flex flex-wrap items-center gap-3">
    <a routerLink="/credit-cards" class="text-sm">{{ 'Voltar para os cartões' }}</a>
    <h1 class="m-0 flex-1 text-2xl font-semibold">{{ card()?.name }}</h1>
    <p-button icon="pi pi-plus" [label]="'Nova compra'" (onClick)="newPurchase()" />
  </header>

  @if (card(); as card) {
    <dl
      class="m-0 grid grid-cols-2 gap-x-6 gap-y-2 rounded-border border border-surface bg-surface-0 p-4 text-sm sm:grid-cols-4 dark:bg-surface-900"
    >
      <div>
        <dt class="text-muted-color">{{ 'Limite' }}</dt>
        <dd class="m-0">{{ card.creditLimit | currency }}</dd>
      </div>
      <div>
        <dt class="text-muted-color">{{ 'Dia de fechamento' }}</dt>
        <dd class="m-0">{{ card.closingDay }}</dd>
      </div>
      <div>
        <dt class="text-muted-color">{{ 'Dia de vencimento' }}</dt>
        <dd class="m-0">{{ card.dueDay }}</dd>
      </div>
      <div>
        <dt class="text-muted-color">{{ 'Conta de pagamento' }}</dt>
        <dd class="m-0">{{ card.paymentAccount.name }}</dd>
      </div>
    </dl>
  }

  <app-data-table [columns]="columns" [list]="invoices" [actions]="actions" (action)="onInvoiceAction($event)" />
</section>
