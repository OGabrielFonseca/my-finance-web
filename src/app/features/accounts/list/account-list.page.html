<app-crud-page title="Contas" (create)="openForm()">
  <app-filter-bar [fields]="filters" [initial]="initialFilter" (changed)="list.setFilter($event)" />

  <app-data-table [columns]="columns" [list]="list" [actions]="actions" (action)="onAction($event)">
    <ng-template appCell="balance" let-account>
      @if (balances()[account.id]; as balance) {
        <span
          class="flex flex-col items-end"
          [attr.title]="'O saldo atual considera só lançamentos efetivados; o projetado inclui os pendentes.'"
        >
          <app-money [amount]="balance.currentBalance" />
          <small class="text-muted-color"> {{ 'Projetado' }}: {{ balance.projectedBalance | currency }} </small>
        </span>
      } @else {
        <p-skeleton width="6rem" styleClass="ml-auto" />
      }
    </ng-template>
  </app-data-table>
</app-crud-page>
