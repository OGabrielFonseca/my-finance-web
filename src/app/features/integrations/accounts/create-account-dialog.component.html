<form [formGroup]="form" (ngSubmit)="submit.submit()" class="flex flex-col gap-4">
  <app-field label="Nome" fieldId="create-account-name" [control]="form.controls.name">
    <input pInputText id="create-account-name" formControlName="name" />
  </app-field>

  <app-field label="Tipo" fieldId="create-account-type" [control]="form.controls.type">
    <p-select
      inputId="create-account-type"
      formControlName="type"
      [options]="typeOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
    />
  </app-field>

  <app-field label="Saldo inicial" fieldId="create-account-balance" [control]="form.controls.initialBalance">
    <p-inputnumber
      inputId="create-account-balance"
      formControlName="initialBalance"
      mode="currency"
      currency="BRL"
      locale="pt-BR"
    />
  </app-field>

  <app-field label="Importar a partir de" fieldId="create-account-import-from" [control]="form.controls.importFrom">
    <p-datepicker
      inputId="create-account-import-from"
      formControlName="importFrom"
      dateFormat="dd/mm/yy"
      [minDate]="range.min"
      [maxDate]="range.max"
      appendTo="body"
    />
  </app-field>

  <p class="m-0 text-sm text-muted-color">
    {{ 'Saldo atual no banco' }}: {{ link.bankBalance ?? 0 | currency }}.
    {{ 'Lançamentos anteriores a essa data não entram na fila agora. Você pode alterar a data depois.' }}
    {{ 'Entre' }} {{ range.min | date: 'dd/MM/yyyy' }} {{ 'e hoje.' }}
  </p>

  <app-form-footer [submit]="submit" (cancelled)="ref.close(false)" />
</form>
