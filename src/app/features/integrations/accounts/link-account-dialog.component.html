<form [formGroup]="form" (ngSubmit)="submit.submit()" class="flex flex-col gap-4">
  <app-field label="Conta do MyFinance" fieldId="link-account" [control]="form.controls.accountId">
    <p-select
      inputId="link-account"
      formControlName="accountId"
      [options]="accountOptions()"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
    />
  </app-field>

  <app-field label="Importar a partir de" fieldId="link-import-from" [control]="form.controls.importFrom">
    <p-datepicker
      inputId="link-import-from"
      formControlName="importFrom"
      dateFormat="dd/mm/yy"
      [minDate]="range.min"
      [maxDate]="range.max"
      appendTo="body"
    />
  </app-field>

  <p class="m-0 text-sm text-muted-color">
    {{ 'Lançamentos anteriores a essa data não entram na fila.' }}
    {{ 'Entre' }} {{ range.min | date: 'dd/MM/yyyy' }} {{ 'e hoje. O banco guarda até 12 meses de lançamentos.' }}
  </p>

  <app-form-footer [submit]="submit" (cancelled)="ref.close(false)" />
</form>
